openapi: 3.1.0
info:
  title: Bookings API
  version: 0.1.0
  description: |
    Organizers publish events with a fixed number of seats, upload an image and read live stats.
    Attendees book and cancel seats, and join a waitlist when an event is sold out: a freed seat is
    offered to the next person, who has a limited time to accept it.
    Every route needs a Cognito access token (`Authorization: Bearer <token>`). Roles come from the
    `organizers` and `attendees` Cognito groups. Errors use RFC 9457 problem details.
servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com
    variables:
      apiId: { default: example }
      region: { default: eu-west-1 }
security:
  - cognito: []

paths:
  /events:
    post:
      summary: Create an event (organizers only)
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEvent" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      summary: List upcoming events, soonest first
      operationId: listEvents
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /events/{eventId}:
    get:
      summary: Get one event
      operationId: getEvent
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: The event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }

  /events/{eventId}/bookings:
    post:
      summary: Book seats (attendees only, idempotent)
      description: |
        Seats are taken in one DynamoDB transaction with a condition on the remaining seats, so an event
        is never oversold. Send a fresh `Idempotency-Key` per booking attempt and reuse it on retries:
        a retry returns the original booking (201) without booking again.
      operationId: bookSeats
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: Idempotency-Key
          in: header
          required: true
          description: 8-128 printable ASCII characters, scoped to the caller. A UUID is the expected choice.
          schema: { type: string, pattern: "^[\\x21-\\x7E]{8,128}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [seats]
              properties:
                seats: { type: integer, minimum: 1, maximum: 10 }
      responses:
        "201":
          description: Booked (or the replay of an earlier booking with the same key)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`ATTENDEE_ONLY`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: "`SOLD_OUT`, `ALREADY_BOOKED`, `CONCURRENT_UPDATE` (retry) or `REQUEST_IN_PROGRESS` (same key still running)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: "`EVENT_STARTED` or `IDEMPOTENCY_KEY_REUSED` (same key, different body)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /events/{eventId}/bookings/{bookingId}:
    delete:
      summary: Cancel your booking and return the seats
      operationId: cancelBooking
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The cancelled booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`BOOKING_NOT_FOUND`, also returned for someone else's booking"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /events/{eventId}/image-upload-url:
    post:
      summary: Get a presigned S3 URL to upload the event image (the event's organizer only)
      description: |
        Upload with a PUT to `uploadUrl`, sending the returned `headers` unchanged (they are signed).
        After the upload, S3 triggers a function that checks the file's magic bytes and attaches the
        image to the event; an object that is not the declared image type is deleted.
      operationId: createImageUpload
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contentType, contentLength]
              properties:
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
                contentLength: { type: integer, minimum: 1, maximum: 5242880 }
      responses:
        "201":
          description: A short-lived upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageUpload" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /events/{eventId}/stats:
    get:
      summary: Booking and waitlist counters (the event's organizer only)
      description: Eventually consistent. Projected from the table's change stream, usually within a second.
      operationId: getEventStats
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: The counters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventStats" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /events/{eventId}/waitlist:
    post:
      summary: Join the waitlist of a sold-out event (attendees only)
      description: |
        When a booking is cancelled, each freed seat is offered to the next person in join order. The
        offer is announced as a `WaitlistSeatOffered` notification and is held for 15 minutes; after
        that it moves to the next person.
      operationId: joinWaitlist
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "201":
          description: On the waitlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistEntry" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: "`SEATS_AVAILABLE` (book instead), `ALREADY_WAITLISTED` or `ALREADY_BOOKED`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: "`EVENT_STARTED`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /events/{eventId}/waitlist/accept:
    post:
      summary: Accept your open seat offer, which books one seat
      operationId: acceptWaitlistOffer
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "201":
          description: The new booking (one seat)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`NO_OFFER`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "`OFFER_EXPIRED`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /me/bookings:
    get:
      summary: List the caller's bookings, newest first
      operationId: listMyBookings
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of bookings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    cognito:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito user pool access token, checked by the API Gateway JWT authorizer.

  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Opaque `nextCursor` from the previous page.
      schema: { type: string, maxLength: 2048 }

  responses:
    Problem:
      description: Problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing or invalid token (returned by API Gateway, not by the functions)

  schemas:
    CreateEvent:
      type: object
      additionalProperties: false
      required: [title, venue, startsAt, capacity]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        venue: { type: string, minLength: 2, maxLength: 120 }
        startsAt: { type: string, format: date-time, description: Must be in the future. }
        capacity: { type: integer, minimum: 1, maximum: 10000 }
    Event:
      type: object
      required: [id, title, venue, startsAt, capacity, seatsRemaining, organizerId, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        venue: { type: string }
        startsAt: { type: string, format: date-time }
        capacity: { type: integer }
        seatsRemaining: { type: integer, minimum: 0 }
        organizerId: { type: string }
        createdAt: { type: string, format: date-time }
        image:
          type: [object, "null"]
          required: [key, contentType, size, uploadedAt]
          properties:
            key: { type: string }
            contentType: { type: string }
            size: { type: integer }
            uploadedAt: { type: string, format: date-time }
    ImageUpload:
      type: object
      required: [uploadUrl, method, headers, key, expiresIn]
      properties:
        uploadUrl: { type: string, format: uri }
        method: { type: string, enum: [PUT] }
        headers: { type: object, additionalProperties: { type: string } }
        key: { type: string }
        expiresIn: { type: integer, description: Seconds until the URL expires. }
    EventStats:
      type: object
      required: [eventId, bookingsConfirmed, bookingsCancelled, seatsBooked, waitlist, updatedAt]
      properties:
        eventId: { type: string, format: uuid }
        bookingsConfirmed: { type: integer }
        bookingsCancelled: { type: integer }
        seatsBooked: { type: integer }
        waitlist:
          type: object
          required: [joined, waiting, offersMade, offersAccepted, offersExpired]
          properties:
            joined: { type: integer }
            waiting: { type: integer }
            offersMade: { type: integer }
            offersAccepted: { type: integer }
            offersExpired: { type: integer }
        updatedAt: { type: [string, "null"], format: date-time }
    WaitlistEntry:
      type: object
      required: [eventId, status, joinedAt, offerExpiresAt]
      properties:
        eventId: { type: string, format: uuid }
        status: { type: string, enum: [WAITING, OFFERED, ACCEPTED, EXPIRED] }
        joinedAt: { type: string, format: date-time }
        offerExpiresAt: { type: [string, "null"], format: date-time }
    EventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Event" } }
        nextCursor: { type: [string, "null"] }
    Booking:
      type: object
      required: [id, eventId, seats, status, createdAt, cancelledAt, event]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        seats: { type: integer, minimum: 1, maximum: 10 }
        status: { type: string, enum: [CONFIRMED, CANCELLED] }
        createdAt: { type: string, format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
        event:
          type: object
          required: [title, startsAt]
          properties:
            title: { type: string }
            startsAt: { type: string, format: date-time }
    BookingPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Booking" } }
        nextCursor: { type: [string, "null"] }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          examples: [VALIDATION_FAILED, SOLD_OUT, IDEMPOTENCY_KEY_REUSED]
        detail: { type: string }
        errors:
          type: object
          description: Field-level messages for `VALIDATION_FAILED`.
          additionalProperties: { type: array, items: { type: string } }
